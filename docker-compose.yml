version: "3.9"

services:
  app:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - YTDLP_PATH=/usr/local/bin/yt-dlp
      - FFMPEG_PATH=ffmpeg
    volumes:
      - downloads:/app/downloads
    restart: unless-stopped

volumes:
  downloads:
